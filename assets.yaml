# GameTest asset manifest (gamekit). One entry per asset; check it with `gamekit validate`.
# What each asset should look or sound like: docs/ART_BRIEF.md and docs/AUDIO_BRIEF.md (the briefs
# decide; keep this file in step with them). Built from the code: src/art/pixel_art.gd (158 art
# assets), Sfx (26 sounds) and Tracks.ALL (9 tracks). Sizes and frames are what the game uses now.
# Not listed (the art brief says not needed): the 6 retired upgrade icons. Floors, bullets, rings, UI panels, particles and the font are drawn by code.
# Field reference: gamekit's templates/assets.yaml.
game: Medieval Survival
output: assets
palette: palette.hex
frame_files: true       # one PNG per frame, named like the game's sprites: ghoul.png, ghoul_walk_1.png, ghoul_attack.png
code_art: src/art/pixel_art.gd   # the game's own text sprites: the asset page shows them until a file replaces them
sprites:                # the game's sprite rules (docs/ART_BRIEF.md), used when a picture becomes a sprite
  prompt: "chunky, chibi proportions, oversized head, big glowing eyes, dark fantasy, front-facing, left-right symmetrical, strong simple silhouette, few details, thick near-black outline, muted desaturated colors"
  outline: "#17121C"    # 1 px near-black outline around every creature
  reserved_colors: ["#FF00FF", "#800080"]  # player colors: the game recolors them, so never snap to them
  game_scale: 3         # 640x360 scaled up by whole numbers: 3x on a 1080p screen
  floors: {The Crypt: "#1C1A21", The Bone Marsh: "#171C12", The Burning Cathedral: "#261614"}  # stage stone colors (src/stages/*.tres)
audio:                  # house levels from docs/AUDIO_BRIEF.md
  sfx_peak_db: -3
  music_lufs: -16
music:                  # `gamekit music render` runs this Godot script to turn Tracks into WAVs
  godot_project: .
  render_script: tools/render_music.gd

